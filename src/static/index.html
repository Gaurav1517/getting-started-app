
<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, maximum-scale=1.0, user-scalable=0" />
    <link rel="stylesheet" href="css/bootstrap.min.css" crossorigin="anonymous" />
    <link rel="stylesheet" href="css/font-awesome/all.min.css" crossorigin="anonymous" />
    <link href="https://fonts.googleapis.com/css?family=Lato&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/styles.css" />
    <title>Todo App</title>
</head>
<body>
    <div id="env-banner" style="position:fixed;top:0;left:0;right:0;z-index:1000;padding:12px;text-align:center;color:#fff;font:bold 15px sans-serif;background:#555">Loading environment...</div>
    <script>
        fetch('/api/version').then(r => r.json()).then(d => {
            const b = document.getElementById('env-banner');
            b.textContent = d.color.toUpperCase() + ' environment | release ' + d.version + ' | served by ' + d.host;
            b.style.background = d.color === 'green' ? '#2e7d32' : d.color === 'blue' ? '#1565c0' : '#555';
        });
    </script>
    <div id="root"></div>
    <script src="js/react.production.min.js"></script>
    <script src="js/react-dom.production.min.js"></script>
    <script src="js/react-bootstrap.js"></script>
    <script src="js/babel.min.js"></script>
    <script type="text/babel" src="js/app.js"></script>
</body>
</html>
